name: Weekly deadline scraper

on:
  schedule:
    # Every Monday at 8am UTC (9am UK time in winter, 10am in summer)
    - cron: '0 8 * * 1'
  # Also lets you run it manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper/scraper.py

      - name: Validate schema
        run: |
          python -c "
          import json, sys
          required = {'id','employer','scheme_name','disciplines','deadline','status','rolling_basis','url','last_verified'}
          data = json.load(open('data/deadlines.json'))
          for e in data['employers']:
              missing = required - set(e.keys())
              if missing:
                  print(f'ERROR: {e.get(\"id\",\"?\")} missing: {missing}')
                  sys.exit(1)
          print(f'Schema OK — {len(data[\"employers\"])} entries valid')
          "

      - name: Count unknown entries
        id: count_unknown
        run: |
          python -c "
          import json
          data = json.load(open('data/deadlines.json'))
          unknown = [e['employer'] for e in data['employers'] if e.get('status') == 'unknown']
          print(f'UNKNOWN_COUNT={len(unknown)}')
          if unknown:
              print('UNKNOWN_LIST=' + ', '.join(unknown))
          " >> $GITHUB_OUTPUT

      - name: Open PR if deadlines.json changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data: weekly deadline update"
          title: "Weekly deadline update — ${{ github.run_id }}"
          body: |
            ## Weekly scraper run

            Review the diff below before merging.

            **⚠️ Unknown entries (need manual check):** ${{ steps.count_unknown.outputs.UNKNOWN_COUNT }}
            ${{ steps.count_unknown.outputs.UNKNOWN_LIST }}

            An `unknown` status means the scraper couldn't find the deadline on the employer's page.
            Possible causes: selector broke (site redesign), scheme not open yet, or IP was rate-limited.

            Verify each unknown entry manually before merging.
          branch: scraper/weekly-update
          delete-branch: true
          labels: data-update
